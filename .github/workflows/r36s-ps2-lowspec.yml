name: R36S - Resident Evil 4 PS2 inspired low-spec GX
on:
  push:
    branches:
      - chatgpt/r36s-ps2-lowspec-renderer
    paths:
      - "port/r36s/gx-host/**"
      - "port/android-decomp/app/src/main/cpp/gx_gl.cpp"
      - "port/android-decomp/app/src/main/cpp/gx_gl.h"
      - ".github/workflows/r36s-ps2-lowspec.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lowspec-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 SDL2 GLES and Ninja dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev libgles-dev
      - name: Compile PS2 quality presets into isolated GLES frontend
        run: |
          set -eux
          cmake -S port/r36s/gx-host -B port/build/r36s-gx-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build port/build/r36s-gx-host --target r36s_game_ps2 --parallel 2
          file port/build/r36s-gx-host/r36s_game_ps2
          readelf -h port/build/r36s-gx-host/r36s_game_ps2 | grep -E "Class:|Machine:"
          test -s port/build/r36s-gx-host/r36s_game_ps2
      - name: Assemble reversible additive overlay without game data
        run: |
          set -euo pipefail
          mkdir -p dist/cubeevil4_live_gx
          cp port/build/r36s-gx-host/r36s_game_ps2 dist/cubeevil4_live_gx/
          for name in RE4-R36S-PS2-LowSpec.sh RE4-R36S-PS2-Balanceado.sh RE4-R36S-PS2-Leve.sh RE4-R36S-PS2-Ultra.sh; do
            sh -n "port/r36s/gx-host/$name"
            cp "port/r36s/gx-host/$name" dist/
            chmod +x "dist/$name"
          done
          cp port/r36s/gx-host/README-PS2-LOW-SPEC.md dist/LEIA-ME-PS2-LOW-SPEC.md
          chmod +x dist/cubeevil4_live_gx/r36s_game_ps2
      - name: Publish ARM64 PS2-inspired experimental graphics package
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-R36S-PS2-LowSpec-ARM64
          path: dist/
          retention-days: 14
