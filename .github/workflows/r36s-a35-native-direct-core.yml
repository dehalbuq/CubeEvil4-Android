name: R36S - native ARM64 fast original RE4 core O3 alternative

on:
  push:
    branches:
      - chatgpt/r36s-a35-core-o3-gx-fastfifo
    paths:
      - ".github/workflows/r36s-a35-native-direct-core.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  direct-native-a35-game-engine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install native Clang linker Ninja and media test prerequisites
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build binutils ffmpeg libc++-dev libc++abi-dev
          clang++ --version
          uname -m
      - name: Configure entire original RE4 engine and 114 modules, arm64 native
        run: |
          set -eux
          cmake -S port/whole -B port/build/whole-a35-native-O3 -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DCMAKE_BUILD_TYPE= \
            -DRE4_OPT_LEVEL=3 -DRE4_R36S_A35_CORE=ON -DRE4_R36S_FAST_FIFO=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compile complete motor native, no GameCube assets
        shell: bash
        run: |
          set -o pipefail
          cmake --build port/build/whole-a35-native-O3 --parallel 2 2>&1 | tee r36s-native-core-compile.log
      - name: Validate all reconstructed runtime modules and game core tests natively
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$PWD/port/build/whole-a35-native-O3"
          for f in re4_host re4_coreproc libre4_main.so libre4_host.so libre4_platform.so;do
            test -s "$BUILD/$f"
            file "$BUILD/$f"
            readelf -h "$BUILD/$f" | grep -E 'Machine:.*AArch64'
          done
          test "$(find "$BUILD/modules" -maxdepth 1 -name 'libre4_*.so' -type f | wc -l)" -ge 114
          python3 port/tools/whole_stub_check.py "$BUILD/generated/link_report.json"
          cd "$BUILD"
          export RE4_CARD_TEST_FILE="$BUILD/card-test.bin"
          export RE4_GCI_TEST_FILE="$BUILD/card-test.gci"
          for check in --self-test --check-modules --runtime-test --core-test;do
            echo "R36S_NATIVE_A35_TEST=$check"
            timeout 300 ./re4_host "$check"
          done
          test -s "$RE4_CARD_TEST_FILE"
          test -s "$RE4_GCI_TEST_FILE"
      - name: Validate the original game save format and separate core IPC process
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$PWD/port/build/whole-a35-native-O3"
          python3 port/tools/memcard_list.py "$BUILD/card-test.bin" --expect-system --expect-save 0
          python3 port/tools/memcard_list.py "$BUILD/card-test.gci" --expect-save 0
          cd "$BUILD"
          timeout 300 ./re4_core_remote_test \
            --program "$BUILD/re4_coreproc" \
            --modules "$BUILD/modules" \
            --card "$BUILD/remote-card.bin" \
            --gci "$BUILD/card-test.gci" \
            --crash-file "$BUILD/remote-crash.txt"
          if command -v llvm-dwarfdump >/dev/null 2>&1; then
            python3 "$GITHUB_WORKSPACE/port/tools/save_layout.py" "$BUILD" --check
          else
            echo "SAVE_LAYOUT_CHECK_SKIPPED=llvm-dwarfdump_not_installed"
          fi
      - name: Stage native tuned game motor and all compiled modules
        run: |
          set -euo pipefail
          OUT=port/build/whole-a35-native-O3
          mkdir -p coreout/modules
          for f in re4_coreproc libre4_main.so libre4_host.so libre4_platform.so; do
            cp "$OUT/$f" coreout/
          done
          cp "$OUT"/modules/libre4_*.so coreout/modules/
          test "$(find coreout/modules -maxdepth 1 -name 'libre4_*.so' | wc -l)" -ge 114
      - uses: actions/upload-artifact@v4
        with:
          name: re4-a35-O3-GX-fastfifo-native-validated-core
          path: coreout/
          retention-days: 14
      - name: Keep native build logs on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: re4-a35-native-core-error-trace
          path: |
            r36s-native-core-compile.log
            port/build/whole-a35-native-O3/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  native-package:
    needs: direct-native-a35-game-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: re4-a35-O3-GX-fastfifo-native-validated-core
          path: stage/core
      - name: Retrieve already compiled matched R36S A35 GLES frontends
        uses: actions/download-artifact@v4
        with:
          name: re4-r36s-a35-75-frontend-compare
          run-id: 40400379034
          github-token: ${{ github.token }}
          path: stage/front
      - name: Make isolated playable native A35 O3 compiled core ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/cubeevil4_live_gx
          mkdir -p "$OUT/core_a35_o3/modules"
          cp stage/core/re4_coreproc stage/core/libre4_main.so \
            stage/core/libre4_host.so stage/core/libre4_platform.so "$OUT/core_a35_o3/"
          cp stage/core/modules/libre4_*.so "$OUT/core_a35_o3/modules/"
          cp stage/front/r36s_game_a35_core_compare stage/front/r36s_game_showcase_a35_o3 "$OUT/"
          for shname in RE4-R36S-Nucleo-A35-O3.sh RE4-R36S-Comparar-Nucleo.sh RE4-R36S-Teste-Nucleo-O2.sh RE4-R36S-Teste-Nucleo-O3.sh;do
            cp "port/r36s/gx-host/$shname" dist/
            sh -n "dist/$shname"
            chmod +x "dist/$shname"
          done
          cp port/r36s/gx-host/README-R36S-CORE-A35-O3.md dist/LEIA-ME-A35-CORE-OPT.md
          chmod +x "$OUT/core_a35_o3/re4_coreproc" "$OUT/r36s_game_a35_core_compare" "$OUT/r36s_game_showcase_a35_o3"
          test "$(find "$OUT/core_a35_o3/modules" -maxdepth 1 -name 'libre4_*.so' | wc -l)" -ge 114
          test ! -e "$OUT/data"
          test ! -e "$OUT/re4_coreproc"
          test ! -e "$OUT/r36s_game_boot"
          test ! -e "$OUT/r36s_game_showcase_menuquiet"
          ! find dist -type f | grep -Ei '\.(iso|gcm|das|drs|rel|gci|sav)$|/data/|/memcard/|card-a\.bin$'
          echo "R36S_A35_CORE=O3_FASTFIFO_NATIVE_TESTED"
          du -sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-R36S-CORE-A35-O3-FASTFIFO-NATIVO-ARM64
          path: dist/
          retention-days: 14
