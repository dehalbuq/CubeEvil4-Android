name: R36S - profile real game GPU frame stages

on:
  push:
    branches:
      - chatgpt/r36s-real-game-frame-profiler
    paths:
      - "port/r36s/gx-host/**"
      - ".github/workflows/r36s-real-game-frame-profiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 SDL2 and GLES3 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev libgles-dev
      - name: Compile real frame profiler without touching stable binary
        run: |
          set -eux
          cmake -S port/r36s/gx-host -B port/build/r36s-gx-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build port/build/r36s-gx-host --target r36s_game_profile --parallel 2
          file port/build/r36s-gx-host/r36s_game_profile
          readelf -h port/build/r36s-gx-host/r36s_game_profile | grep -E "Class:|Machine:"
          test -s port/build/r36s-gx-host/r36s_game_profile
      - name: Assemble profiler-only R36S overlay
        run: |
          set -euo pipefail
          mkdir -p dist/cubeevil4_live_gx
          cp port/build/r36s-gx-host/r36s_game_profile dist/cubeevil4_live_gx/
          cp port/r36s/gx-host/RE4-R36S-Perfil-GPU.sh dist/
          cp port/r36s/gx-host/README-REAL-GAME-PROFILER.md dist/LEIA-ME-PERFIL-GPU.md
          chmod +x dist/cubeevil4_live_gx/r36s_game_profile dist/RE4-R36S-Perfil-GPU.sh
      - name: Upload ARM64 profiler package
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-R36S-Perfil-GPU-ARM64
          path: dist/
          retention-days: 14
