name: R36S dArkOSRE CloudLab (native ARM64 synthetic tests)
on:
  workflow_dispatch:
  push:
    paths:
      - 'r36s_cloudlab/**'
      - '.github/workflows/darkosre-cloudlab.yml'
  pull_request:
    paths:
      - 'r36s_cloudlab/**'
      - '.github/workflows/darkosre-cloudlab.yml'
permissions:
  contents: read
jobs:
  r36s-functional-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      CLOUDLAB_STRICT_ARM64: '1'
      CLOUDLAB_REQUIRE_GLES3: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 compiler, Mesa software GLES3 and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld cmake ninja-build build-essential \
            python3 pkg-config libegl-dev libgles-dev libgl1-mesa-dri libsdl2-dev
      - name: Run ARM64 Phase 1-4, HIPC/CMIF wire, W^X, 512 MiB memory profile and Mesa GLES3
        shell: bash
        run: |
          set -o pipefail
          sh r36s_cloudlab/cloud/run-cloud-tests.sh 2>&1 | tee darkosre-cloudlab-results.log
          test -f r36s_cloudlab/.cloud-build/hardware-profile.json
      - name: Re-run synthetic suite under R36S 895 MiB cgroup memory cap
        shell: bash
        run: |
          set -o pipefail
          docker build -q --platform linux/arm64 -f r36s_cloudlab/cloud/Dockerfile -t r36s-darkosre-cloudlab-v2 r36s_cloudlab
          docker run --rm --platform linux/arm64 --memory=895m --memory-swap=895m --cpus=4 \
            -e CLOUDLAB_REQUIRE_GLES3=1 -e CLOUDLAB_STRICT_ARM64=1 \
            r36s-darkosre-cloudlab-v2 2>&1 | tee darkosre-cgroup-memory-results.log
      - name: Publish diagnostic results (NOT real hardware FPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36s-cloudlab-aarch64-results
          path: |
            darkosre-cloudlab-results.log
            r36s_cloudlab/.cloud-build/hardware-profile.json
            darkosre-cgroup-memory-results.log
          if-no-files-found: warn
          retention-days: 14
