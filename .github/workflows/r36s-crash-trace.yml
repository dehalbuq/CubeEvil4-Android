name: R36S - first boot crash trace (ARM64)

on:
  push:
    branches:
      - chatgpt/r36s-boot-crash-trace
    paths:
      - "port/r36s/gx-host/**"
      - ".github/workflows/r36s-crash-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash-tracer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev libgles-dev
      - name: Compile instrumented Linux ARM64 game boot
        run: |
          set -eux
          cmake -S port/r36s/gx-host -B port/build/r36s-gx-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build port/build/r36s-gx-host --target r36s_game_boot --parallel 2
          file port/build/r36s-gx-host/r36s_game_boot
          readelf -h port/build/r36s-gx-host/r36s_game_boot | grep -E 'Class:|Machine:'
          readelf -S port/build/r36s-gx-host/r36s_game_boot | grep -E '\.debug_info|\.symtab' || true
      - name: Assemble overlay only - leave known-good core and modules intact
        run: |
          set -euo pipefail
          mkdir -p dist/cubeevil4_live_gx
          cp port/build/r36s-gx-host/r36s_game_boot dist/cubeevil4_live_gx/
          cp port/r36s/gx-host/RE4-Primeiro-Boot.sh dist/
          chmod +x dist/cubeevil4_live_gx/r36s_game_boot dist/RE4-Primeiro-Boot.sh
          cat > dist/README-CRASH-TRACE.txt <<'NOTES'
          CUBEEVIL4 R36S - CRASH DIAGNOSTIC (EXPERIMENTAL)
          Extract over /roms/ports; replace ONLY cubeevil4_live_gx/r36s_game_boot.
          Keep the working re4_coreproc, all libraries, original extracted game
          data and 114 modules. Launch RE4-Primeiro-Boot.sh from Ports.
          When it crashes, the full frontend crash address, PC/LR,
          last GX stage, frame, and /proc/self/maps should be appended to:
          /roms/ports/cubeevil4_live_gx/diagnostico_primeiro_boot_darkos.txt
          Share only the text log, NOT the proprietary game data.
          NOTES
      - name: Upload self-contained ARM64 crash diagnosis overlay
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-R36S-Diagnostico-SIGSEGV-ARM64
          path: dist/
          retention-days: 14
