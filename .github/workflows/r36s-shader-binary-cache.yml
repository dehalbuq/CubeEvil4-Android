name: R36S - persistent shader binary cache test
on:
  push:
    branches:
      - chatgpt/r36s-shader-binary-cache
    paths:
      - "port/r36s/gx-host/**"
      - ".github/workflows/r36s-shader-binary-cache.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shader-cache-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 C++ GLES and SDL2 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev libgles-dev
      - name: Build ARM64 shader cache frontend without altering stable game binary
        run: |
          set -eux
          cmake -S port/r36s/gx-host -B port/build/r36s-gx-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build port/build/r36s-gx-host --target r36s_game_shadercache --parallel 2
          file port/build/r36s-gx-host/r36s_game_shadercache
          readelf -h port/build/r36s-gx-host/r36s_game_shadercache | grep -E 'Class:|Machine:'
          test -s port/build/r36s-gx-host/r36s_game_shadercache
      - name: Package isolated test launcher and executable only
        run: |
          set -euo pipefail
          sh -n port/r36s/gx-host/RE4-R36S-Cache-Shaders.sh
          mkdir -p dist/cubeevil4_live_gx
          cp port/build/r36s-gx-host/r36s_game_shadercache dist/cubeevil4_live_gx/
          cp port/r36s/gx-host/RE4-R36S-Cache-Shaders.sh dist/
          cp port/r36s/gx-host/README-R36S-SHADER-CACHE.md dist/LEIA-ME-SHADER-CACHE.md
          chmod +x dist/cubeevil4_live_gx/r36s_game_shadercache dist/RE4-R36S-Cache-Shaders.sh
      - name: Upload ARM64 shader binary cache test overlay
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-R36S-Shader-Binary-Cache-ARM64
          path: dist/
          retention-days: 14
